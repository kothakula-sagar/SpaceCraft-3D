<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BuildCraft Home Designer</title>
  <meta name="description" content="Interactive 3D home and building configurator: plot, BHK, facing, rooms, doors, windows, furniture, materials, Vastu, cost, export and share.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="home">
  <div id="home"></div>
  <div id="editor"></div>

  <!-- 3D engine (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Core: pure logic, no DOM / three.js -->
  <script src="js/core/util.js"></script>
  <script src="js/core/catalog.js"></script>
  <script src="js/core/model.js"></script>
  <script src="js/core/orientation.js"></script>
  <script src="js/core/geometry.js"></script>
  <script src="js/core/metrics.js"></script>
  <script src="js/core/commands.js"></script>
  <script src="js/core/vastu.js"></script>
  <script src="js/core/cost.js"></script>
  <script src="js/core/generator.js"></script>

  <!-- State & persistence -->
  <script src="js/state/store.js"></script>
  <script src="js/persistence/repo.js"></script>

  <!-- Views -->
  <script src="js/engine3d/materials3d.js"></script>
  <script src="js/engine3d/builders.js"></script>
  <script src="js/engine3d/viewer.js"></script>
  <script src="js/plan2d/plan.js"></script>
  <script src="js/export/export.js"></script>

  <!-- UI -->
  <script src="js/ui/components.js"></script>
  <script src="js/ui/panels.js"></script>
  <script src="js/ui/inspector.js"></script>
  <script src="js/ui/editor.js"></script>
  <script src="js/ui/dashboard.js"></script>
  <script src="js/ui/dialogs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
